[project]
name = "model-lab"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Texto-modelo do model card: prosa em linha longa.
[tool.ruff.lint.per-file-ignores]
"model_lab/make_card_transformer.py" = ["E501"]
"space/app.py" = ["E501"]  # texto explicativo da demo
